name: Integration Test

on:
  workflow_dispatch:
    inputs:
      memo:
        description: 'run intent memo'
        required: false
  pull_request:
    paths:
      - 'integration_test/**'
      - 'lib/screens/**'
      - 'lib/widgets/**'
      - 'scripts/a11y_device_audit.py'
      - 'scripts/wait_emulator_settled.py'
      - '.github/workflows/integration-test.yml'

permissions:
  contents: write

jobs:
  emulator-test:
    # The last green run (2026-09-20) was ubuntu-24.04 + emulator 37.1.11 (build 15917651).
    # Since 2026-11-15 the system/launcher stalls right after boot on 24.04 and 26.04, with
    # emulator 37.1.11 and 37.2.13, and with Flutter 3.47.5 and 3.47.9 (3 of 11 runs passed),
    # so the job is made robust instead: the APK is built before the emulator starts, the
    # emulator gets 4 cores, and the script waits for the system to settle before opening the app.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 2026-08-19: 空きが 6322MB しかなく userdata (7372MB) を作れずエミュレータが
      # 起動しなかった（FATAL | Not enough space to create userdata partition）。
      # このジョブで使わない大物だけ消す（Flutter/Java の hostedtoolcache は残す）。
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # pinned; flutter-update-check.yml opens an issue when a newer stable is out
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Built here, not inside the emulator script: building there made Gradle and the
      # booting emulator share the runner's CPUs. The daemon is stopped so it does not
      # hold memory while the emulator runs. The build tree is removed (the APK is kept in
      # RUNNER_TEMP): with it on disk the emulator had 6.5 GB for its 7.4 GB userdata and
      # never started (2cab390, all 3 runs: "Not enough space to create userdata partition").
      # flutter drive below builds its own debug APK anyway.
      - name: Build profile APK for the device audit
        run: |
          flutter build apk --profile
          cp build/app/outputs/flutter-apk/app-profile.apk "$RUNNER_TEMP/app-profile.apk"
          (cd android && ./gradlew --stop) || true
          rm -rf build
          df -h /

      - name: Run integration test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          emulator-build: 15917651  # emulator 37.1.11, as on the last green run
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p shots

            # 実機が読み上げ機構へ何を渡しているかを測る。
            # test/a11y_names_test.dart はソースを読んだ静的な掃引なので、
            # 実際に画面へ出たときの姿は保証しない。uiautomator を
            # アクセシビリティ client として繋ぎ、押せるノードに名前が
            # 入っているかを実機のツリーで数える（0 でなければ落とす）。
            #
            # エミュレータが最も軽い最初に回す（4 本の drive のあとに置くと
            # 起動が ANR に入り、3 回とも ホームへ入れなかった）。
            # debug ではなく profile ビルド＝JIT の暖機が無く起動が速い。
            # 署名は debug 鍵なので追加の秘密情報は要らない。
            timeout 360 python3 scripts/wait_emulator_settled.py || true
            adb install -r "$RUNNER_TEMP/app-profile.apk"
            python3 scripts/a11y_device_audit.py
            # drive 側は自分でビルドし直すので、監査で入れたものは片付ける
            adb uninstall com.diary.daily || true

            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/home_screenshot_test.dart --dart-define=THEME=light
            cp -f screenshots/*.png shots/ 2>/dev/null || true
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/home_screenshot_test.dart --dart-define=THEME=dark
            cp -f screenshots/*.png shots/ 2>/dev/null || true
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/home_screenshot_test.dart --dart-define=THEME=light --dart-define=LOCALE=en
            cp -f screenshots/*.png shots/ 2>/dev/null || true
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_flow_test.dart
            cp -f screenshots/*.png shots/ 2>/dev/null || true

      # 実画面の見た目を確認できる唯一の経路（Codespace 退役後）。
      # artifact は使わない: Actions の storage 枠が恒常的に超過していて
      # upload が全 repo で hard fail する（実測 2026-08-19
      # 'Failed to CreateArtifact: Artifact storage quota has been hit'）。
      # 実績のある回避策どおり、成果物は専用ブランチへ直接 commit する。
      - name: Publish home screenshots to ci-screenshots branch
        # fork からの PR は書き込めない
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          cp -f screenshots/*.png shots/ 2>/dev/null || true
          if [ -z "$(ls -A shots 2>/dev/null)" ]; then
            echo 'screenshots が無いので publish しない'; exit 0
          fi
          tmp=$(mktemp -d)
          cp shots/*.png "$tmp"/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan ci-screenshots
          git rm -rf --cached . -q
          mkdir -p screenshots
          cp "$tmp"/*.png screenshots/
          git add -f screenshots
          git commit -m "ci: ホームの実画面（${GITHUB_SHA::7}）"
          git push -f origin ci-screenshots
          echo "published: $(ls screenshots)"
