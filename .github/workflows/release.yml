name: Release

# Google Play へのリリース。非公開の daily-diary（android-build.yml / release-build-check.yml）から
# 2026-11-26 に移した: 非公開リポジトリの Actions の枠が尽きてジョブが起動しなくなったため。
#
#   タグ v<version>        … 署名つき release AAB を作って確かめ、Google Play の production へ上げる（即公開）
#   タグ check-<なんでも>  … 同じビルドと確かめだけ。上げない
#
# タグは main の履歴にあるコミットに付ける。v タグは pubspec.yaml の version（+ の前）と一致させる。
# 署名の鍵・サービスアカウント・本番の AdMob ID は "production" 環境の Secrets にだけ置く。
# この環境は v* と check-* のタグからしか使えないようにしてあるので、PR（fork を含む）や
# ブランチへの push からは Secrets に届かない。ログは公開されるので、Secrets は表に出さない。
# Secrets に触れるジョブなので、使う action はタグでなくコミット SHA で固定する（タグの付け替えで中身を差し替えられないように）。

on:
  push:
    tags:
      - 'v*'
      - 'check-*'

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must be on main (and match the version)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG は main の履歴に無い"; exit 1; }
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')
          echo "source: $(git log -1 --format='%h %s') / version $version"
          case "$TAG" in
            v*) [ "$TAG" = "v$version" ] || { echo "::error::タグ $TAG と pubspec.yaml の version ($version) が違う"; exit 1; } ;;
          esac

      - name: Read the Flutter pin
        id: pin
        run: |
          v=$(grep -rhoP "flutter-version: '\K[0-9]+\.[0-9]+\.[0-9]+(?=')" .github/workflows | sort -u)
          [ "$(printf '%s\n' "$v" | grep -c .)" -eq 1 ] || { echo "::error::Flutter の固定が 1 つに決まらない: $v"; exit 1; }
          echo "flutter=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.pin.outputs.flutter }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build and check the signed release AAB
        id: aab
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ANDROID: ${{ secrets.ADMOB_BANNER_ANDROID }}
        run: bash scripts/build_release.sh

      - name: Publish to Google Play (production)
        if: startsWith(github.ref_name, 'v')
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.diary.daily
          releaseFiles: ${{ steps.aab.outputs.aab }}
          track: production
          status: completed
