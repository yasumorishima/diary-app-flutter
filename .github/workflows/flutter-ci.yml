name: Flutter CI

on:
  push:
    branches:
      - main
      # Claude Code のクラウドセッションの作業ブランチ。そこから workflow_dispatch は
      # 叩けない（GitHub App に Actions の書き込み権限が無く 403）ので、push で回す
      - 'ccr-**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Android ビルド用（integration-test.yml と同じ版）
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # pinned; flutter-update-check.yml opens an issue when a newer stable is out
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # pubspec.yaml を変えたのに pubspec.lock を更新し忘れると、ビルドのたびに
      # 解決し直した版で作ることになる。差分を出して落とす。
      - name: Check pubspec.lock is up to date
        run: git diff --exit-code pubspec.lock

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Kotlin（MainActivity / AgeSignalsChannel など）・Gradle・依存の minSdk は
      # analyze と test では確かめられないので、APK まで作って落ちないことを見る
      - name: Build debug APK
        run: flutter build apk --debug
